<svg viewBox="0 0 740 420" width="1480" height="840" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff;">
    <!-- Marco del Sistema -->
    <rect x="180" y="20" width="380" height="380" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 2"/>
    <text x="370" y="42" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Plataforma Motrick (MVP)</text>

    <!-- Usuario Propietario -->
    <g transform="translate(45, 120)">
      <circle cx="20" cy="15" r="10" fill="#ffffff" stroke="#0f172a" stroke-width="1.8"/>
      <line x1="20" y1="25" x2="20" y2="52" stroke="#0f172a" stroke-width="1.8"/>
      <line x1="2" y1="35" x2="38" y2="35" stroke="#0f172a" stroke-width="1.8"/>
      <line x1="20" y1="52" x2="6" y2="75" stroke="#0f172a" stroke-width="1.8"/>
      <line x1="20" y1="52" x2="34" y2="75" stroke="#0f172a" stroke-width="1.8"/>
      <text x="20" y="92" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#0f172a" text-anchor="middle">Usuario<tspan x="20" dy="12">(Propietario)</tspan></text>
    </g>

    <!-- Mecanico Taller -->
    <g transform="translate(45, 290)">
      <circle cx="20" cy="15" r="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/>
      <line x1="20" y1="25" x2="20" y2="52" stroke="#2563eb" stroke-width="1.8"/>
      <line x1="2" y1="35" x2="38" y2="35" stroke="#2563eb" stroke-width="1.8"/>
      <line x1="20" y1="52" x2="6" y2="75" stroke="#2563eb" stroke-width="1.8"/>
      <line x1="20" y1="52" x2="34" y2="75" stroke="#2563eb" stroke-width="1.8"/>
      <text x="20" y="92" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#2563eb" text-anchor="middle">Mecánico<tspan x="20" dy="12">o Taller</tspan></text>
    </g>

    <!-- Administrador -->
    <g transform="translate(640, 210)">
      <circle cx="20" cy="15" r="10" fill="#ffffff" stroke="#b91c1c" stroke-width="1.8"/>
      <line x1="20" y1="25" x2="20" y2="52" stroke="#b91c1c" stroke-width="1.8"/>
      <line x1="2" y1="35" x2="38" y2="35" stroke="#b91c1c" stroke-width="1.8"/>
      <line x1="20" y1="52" x2="6" y2="75" stroke="#b91c1c" stroke-width="1.8"/>
      <line x1="20" y1="52" x2="34" y2="75" stroke="#b91c1c" stroke-width="1.8"/>
      <text x="20" y="92" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#b91c1c" text-anchor="middle">Administrador<tspan x="20" dy="12">(Equipo Motrick)</tspan></text>
    </g>

    <!-- Casos de Uso (Ellipses) -->
    <!-- UC1: Buscar repuestos -->
    <ellipse cx="280" cy="80" rx="75" ry="20" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/>
    <text x="280" y="84" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" fill="#0f172a" text-anchor="middle">Buscar repuestos por auto</text>

    <!-- UC2: Contactar Taller por WhatsApp (extend) -->
    <ellipse cx="460" cy="80" rx="78" ry="20" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
    <text x="460" y="84" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="8.8" font-weight="600" fill="#1e40af" text-anchor="middle">Contactar taller por WhatsApp</text>

    <!-- UC3: Filtrar mecánicos -->
    <ellipse cx="280" cy="140" rx="75" ry="20" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/>
    <text x="280" y="144" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" fill="#0f172a" text-anchor="middle">Filtrar talleres mecánicos</text>

    <!-- UC4: Consultar valoraciones -->
    <ellipse cx="280" cy="200" rx="75" ry="20" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/>
    <text x="280" y="204" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" fill="#0f172a" text-anchor="middle">Consultar valoraciones</text>

    <!-- UC5: Registrar bitácora -->
    <ellipse cx="280" cy="260" rx="75" ry="20" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/>
    <text x="280" y="264" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" fill="#0f172a" text-anchor="middle">Registrar mantenimiento</text>

    <!-- UC6: Vincular repuesto (extend) -->
    <ellipse cx="460" cy="260" rx="70" ry="20" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
    <text x="460" y="264" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" fill="#1e40af" text-anchor="middle">Vincular pieza catálogo</text>

    <!-- UC7: Solicitar Verificación (Mecánico) -->
    <ellipse cx="280" cy="325" rx="78" ry="20" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/>
    <text x="280" y="329" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" fill="#92400e" font-weight="600" text-anchor="middle">Solicitar verificación taller</text>

    <!-- UC8: Aprobar verificación (Admin) -->
    <ellipse cx="460" cy="340" rx="75" ry="20" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.4"/>
    <text x="460" y="344" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" fill="#991b1b" font-weight="600" text-anchor="middle">Verificar y aprobar talleres</text>

    <!-- Lineas Usuario -->
    <line x1="85" y1="160" x2="205" y2="85" stroke="#475569" stroke-width="1.2"/>
    <line x1="85" y1="165" x2="205" y2="140" stroke="#475569" stroke-width="1.2"/>
    <line x1="85" y1="170" x2="205" y2="200" stroke="#475569" stroke-width="1.2"/>
    <line x1="85" y1="180" x2="205" y2="255" stroke="#475569" stroke-width="1.2"/>

    <!-- Lineas Mecanico -->
    <line x1="85" y1="330" x2="202" y2="330" stroke="#2563eb" stroke-width="1.4"/>

    <!-- Lineas Administrador -->
    <line x1="640" y1="260" x2="535" y2="340" stroke="#b91c1c" stroke-width="1.4"/>

    <!-- Relaciones extend con flechas dashed -->
    <line x1="382" y1="80" x2="355" y2="80" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="3 3"/>
    <text x="368" y="73" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="8" fill="#2563eb" text-anchor="middle">&lt;&lt;extend&gt;&gt;</text>

    <line x1="390" y1="260" x2="355" y2="260" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="3 3"/>
    <text x="375" y="253" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="8" fill="#2563eb" text-anchor="middle">&lt;&lt;extend&gt;&gt;</text>
  </svg>