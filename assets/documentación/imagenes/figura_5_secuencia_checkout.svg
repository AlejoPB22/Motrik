<svg viewBox="0 0 740 540" width="1480" height="1080" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff; font-family:'Segoe UI', Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Marcador de flecha solida -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <!-- Marcador de flecha retorno (linea abierta / dashed) -->
    <marker id="arrow-return" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- ==================== PARTICIPANTES (SUPERIOR) ==================== -->
  <!-- Actor Usuario -->
  <g transform="translate(60, 15)">
    <circle cx="20" cy="12" r="9" fill="#ffffff" stroke="#0f172a" stroke-width="1.8"/>
    <line x1="20" y1="21" x2="20" y2="44" stroke="#0f172a" stroke-width="1.8"/>
    <line x1="4" y1="30" x2="36" y2="30" stroke="#0f172a" stroke-width="1.8"/>
    <line x1="20" y1="44" x2="7" y2="64" stroke="#0f172a" stroke-width="1.8"/>
    <line x1="20" y1="44" x2="33" y2="64" stroke="#0f172a" stroke-width="1.8"/>
    <text x="20" y="78" font-size="10.5" font-weight="bold" fill="#0f172a" text-anchor="middle">Usuario<tspan x="20" dy="13">(Cliente)</tspan></text>
  </g>

  <!-- Participante 2: Frontend -->
  <g transform="translate(205, 30)">
    <rect x="0" y="0" width="140" height="42" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
    <text x="70" y="17" font-size="10.5" font-weight="bold" fill="#1e40af" text-anchor="middle">Interfaz Frontend<tspan x="70" dy="14" font-weight="normal" font-size="9.5" fill="#3b82f6">(Next.js / Modal)</tspan></text>
  </g>

  <!-- Participante 3: DirectorioService -->
  <g transform="translate(395, 30)">
    <rect x="0" y="0" width="145" height="42" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
    <text x="72.5" y="17" font-size="10.5" font-weight="bold" fill="#5b21b6" text-anchor="middle">DirectorioService<tspan x="72.5" dy="14" font-weight="normal" font-size="9.5" fill="#6d28d9">(Taller Asignado)</tspan></text>
  </g>

  <!-- Participante 4: API WhatsApp -->
  <g transform="translate(585, 30)">
    <rect x="0" y="0" width="130" height="42" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
    <text x="65" y="17" font-size="10.5" font-weight="bold" fill="#065f46" text-anchor="middle">API WhatsApp<tspan x="65" dy="14" font-weight="normal" font-size="9.5" fill="#047857">(Canal Taller)</tspan></text>
  </g>

  <!-- ==================== LINEAS DE VIDA ==================== -->
  <line x1="80" y1="100" x2="80" y2="465" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="275" y1="75" x2="275" y2="465" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="467" y1="75" x2="467" y2="465" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="650" y1="75" x2="650" y2="465" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 4"/>

  <!-- ==================== CAJAS DE ACTIVACION ==================== -->
  <!-- Frontend: activa desde paso 1 hasta paso 7 -->
  <rect x="269" y="125" width="12" height="315" fill="#ffffff" stroke="#2563eb" stroke-width="1.3" rx="2"/>
  
  <!-- DirectorioService: activa en paso 2 y 3 -->
  <rect x="461" y="165" width="12" height="50" fill="#ffffff" stroke="#7c3aed" stroke-width="1.3" rx="2"/>

  <!-- WhatsApp: activa en paso 6 y 7 -->
  <rect x="644" y="380" width="12" height="50" fill="#ffffff" stroke="#059669" stroke-width="1.3" rx="2"/>

  <!-- ==================== MENSAJES ==================== -->

  <!-- Paso 1: Usuario -> Frontend -->
  <line x1="80" y1="125" x2="267" y2="125" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="173" y="118" font-size="9" font-weight="600" fill="#0f172a" text-anchor="middle">1: Clic en "Contactar Taller" para repuesto</text>

  <!-- Paso 2: Frontend -> DirectorioService -->
  <line x1="281" y1="165" x2="459" y2="165" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="370" y="157" font-size="9" font-weight="600" fill="#0f172a" text-anchor="middle">2: getTallerAsignado(categoria, "Cartagena")</text>

  <!-- Paso 3: DirectorioService --> Frontend (Retorno) -->
  <line x1="461" y1="210" x2="283" y2="210" stroke="#7c3aed" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrow-return)"/>
  <text x="372" y="203" font-size="8.8" font-weight="600" fill="#6d28d9" text-anchor="middle">3: Retorna datos del taller (Nombre, Sede, WhatsApp)</text>

  <!-- Nota de Regla de Negocio (Art 53 Ley 1480) -->
  <g transform="translate(295, 235)">
    <polygon points="0,0 215,0 225,10 225,48 0,48" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
    <polygon points="215,0 215,10 225,10" fill="#fde68a" stroke="#d97706" stroke-width="1"/>
    <text x="10" y="16" font-size="8.5" font-weight="bold" fill="#92400e">Portal de Contacto (Art. 53 Ley 1480 de 2011)</text>
    <text x="10" y="30" font-size="8" fill="#78350f">Sin intermediación financiera ni captura de tarjetas.</text>
    <text x="10" y="42" font-size="8" fill="#78350f">Enlace directo para cotización e instalación presencial.</text>
  </g>

  <!-- Paso 4: Frontend --> Usuario (Despliega Modal) -->
  <line x1="269" y1="305" x2="82" y2="305" stroke="#2563eb" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrow-return)"/>
  <text x="175" y="298" font-size="8.8" font-weight="600" fill="#1e40af" text-anchor="middle">4: Despliega modal de contacto B2B (Ficha y taller aliado)</text>

  <!-- Paso 5: Usuario -> Frontend (Clic en WhatsApp) -->
  <line x1="80" y1="345" x2="267" y2="345" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="173" y="338" font-size="9" font-weight="600" fill="#0f172a" text-anchor="middle">5: Clic en "Iniciar Chat por WhatsApp"</text>

  <!-- Paso 6: Frontend -> WhatsApp -->
  <line x1="281" y1="385" x2="642" y2="385" stroke="#059669" stroke-width="1.4" marker-end="url(#arrow-green)"/>
  <text x="462" y="378" font-size="9" font-weight="600" fill="#065f46" text-anchor="middle">6: Redirige con enlace wa.me (mensaje prellenado con pieza y auto)</text>

  <!-- Paso 7: WhatsApp --> Usuario (Abre Chat) -->
  <line x1="644" y1="425" x2="82" y2="425" stroke="#059669" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrow-return)"/>
  <text x="360" y="418" font-size="8.8" font-weight="600" fill="#047857" text-anchor="middle">7: Abre conversación directa con el taller en Cartagena para compra e instalación</text>

  <!-- ==================== PARTICIPANTES (INFERIOR) ==================== -->
  <g transform="translate(60, 475)">
    <circle cx="20" cy="12" r="9" fill="#ffffff" stroke="#0f172a" stroke-width="1.8"/>
    <line x1="20" y1="21" x2="20" y2="40" stroke="#0f172a" stroke-width="1.8"/>
    <line x1="4" y1="28" x2="36" y2="28" stroke="#0f172a" stroke-width="1.8"/>
    <line x1="20" y1="40" x2="8" y2="54" stroke="#0f172a" stroke-width="1.8"/>
    <line x1="20" y1="40" x2="32" y2="54" stroke="#0f172a" stroke-width="1.8"/>
  </g>
  <g transform="translate(205, 475)">
    <rect x="0" y="0" width="140" height="36" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
    <text x="70" y="22" font-size="10" font-weight="bold" fill="#1e40af" text-anchor="middle">Interfaz Frontend</text>
  </g>
  <g transform="translate(395, 475)">
    <rect x="0" y="0" width="145" height="36" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
    <text x="72.5" y="22" font-size="10" font-weight="bold" fill="#5b21b6" text-anchor="middle">DirectorioService</text>
  </g>
  <g transform="translate(585, 475)">
    <rect x="0" y="0" width="130" height="36" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
    <text x="65" y="22" font-size="10" font-weight="bold" fill="#065f46" text-anchor="middle">API WhatsApp</text>
  </g>
</svg>
